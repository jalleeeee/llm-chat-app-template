<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Allerion Genesis AI — Demo</title>
<style>
  :root {
    --bg:#040506; --surface:#0c0e10; --accent:#5a6850; --silver:#9da2a6;
    --text:#d1d5db; --muted:#6b7280; --border:rgba(90,104,80,0.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:1rem;letter-spacing:.15em;color:#f5f6f8}
  header h1 span{color:var(--silver)}
  .badge{font:600 0.65rem/1 monospace;color:var(--accent);
    border:1px solid var(--accent);padding:.25rem .5rem;letter-spacing:.1em}
  main{flex:1;display:flex;flex-direction:column;max-width:780px;width:100%;
    margin:0 auto;padding:1rem}
  #log{flex:1;overflow-y:auto;padding:1rem 0;display:flex;flex-direction:column;gap:.75rem}
  .msg{padding:.75rem 1rem;border:1px solid var(--border);background:var(--surface)}
  .msg.user{border-color:var(--silver)}
  .msg .role{font:600 .65rem/1 monospace;color:var(--accent);
    text-transform:uppercase;letter-spacing:.15em;margin-bottom:.4rem}
  .msg.user .role{color:var(--silver)}
  .tool{font:.75rem/1.4 monospace;color:var(--accent);padding:.4rem .5rem;
    background:rgba(90,104,80,.08);border-left:2px solid var(--accent);margin-top:.4rem}
  form{display:flex;gap:.5rem;padding:.75rem 0;border-top:1px solid var(--border)}
  input{flex:1;padding:.75rem;background:#000;border:1px solid var(--border);
    color:var(--text);font:inherit}
  button{padding:.75rem 1.25rem;background:var(--accent);border:none;color:#fff;
    font:600 .8rem/1 monospace;letter-spacing:.1em;cursor:pointer}
  button:hover{background:#6a7660}
  .hint{font:.7rem/1.4 monospace;color:var(--muted);padding:.5rem 0}
</style>
</head>
<body>
<header>
  <h1>ALLERION<span>.LLC</span> · GENESIS AI</h1>
  <span class="badge">DEMO · WORKERS AI</span>
</header>
<main>
  <div id="log"></div>
  <div class="hint">Try: "show me the Dubois mine", "what BIM libraries can we plug in?", "drop a drill target between Indiana and Dubois".</div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask Genesis AI…" />
    <button>Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const f = document.getElementById("f");
  const q = document.getElementById("q");
  const history = [];

  function add(role, text, toolCalls) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = `<div class="role">${role}</div><div></div>`;
    div.children[1].textContent = text || "";
    if (toolCalls && toolCalls.length) {
      for (const tc of toolCalls) {
        const t = document.createElement("div");
        t.className = "tool";
        t.textContent = `→ ${tc.function.name}(${tc.function.arguments})`;
        div.appendChild(t);
      }
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    q.value = "";
    add("user", text);
    history.push({ role: "user", content: text });
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await r.json();
      const msg = data.choices?.[0]?.message ?? data.response ?? data;
      const content = typeof msg === "string" ? msg : msg.content || "";
      const toolCalls = msg.tool_calls || data.tool_calls || [];
      add("assistant", content, toolCalls);
      history.push({ role: "assistant", content, tool_calls: toolCalls });
    } catch (err) {
      add("assistant", "Error: " + err.message);
    }
  });
</script>
</body>
</html>
